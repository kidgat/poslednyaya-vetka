<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Последняя ветка">
<meta name="theme-color" content="#06080a">
<title>Последняя ветка 0.2</title>
<style>
:root{--ink:#e9e2cf;--gold:#e8b86a;--muted:#a9b2ad;--panel:rgba(7,10,13,.66);--line:rgba(232,184,106,.30);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#06080a;color:var(--ink);overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
#screen{position:fixed;left:0;top:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
/* Сенсорный слой: левая половина экрана — «влево», правая — «вправо». */
#touch{position:fixed;inset:0;z-index:2;touch-action:none}
#hud{position:fixed;z-index:3;top:calc(env(safe-area-inset-top) + 10px);left:calc(env(safe-area-inset-left) + 12px);
  right:calc(env(safe-area-inset-right) + 12px);display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.station{background:var(--panel);border:1px solid var(--line);padding:6px 10px 7px;line-height:1.3}
.station b{display:block;font-size:13px;letter-spacing:.16em;color:var(--gold)}
.station span{font-size:11px;color:var(--muted);letter-spacing:.03em}
#ver{pointer-events:auto;background:var(--panel);border:1px solid var(--line);color:var(--muted);font:inherit;font-size:11px;
  padding:6px 9px;letter-spacing:.08em;cursor:pointer}
#hint{position:fixed;z-index:3;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);
  font-size:11px;color:#d4ccb6;background:var(--panel);padding:6px 11px;border:1px solid var(--line);white-space:nowrap;
  pointer-events:none;transition:opacity 1s}
#hint.gone{opacity:0}
.pad{position:fixed;z-index:3;bottom:calc(env(safe-area-inset-bottom) + 14px);width:86px;height:86px;border-radius:50%;
  background:rgba(8,11,14,.42);border:2px solid rgba(232,184,106,.38);display:grid;place-items:center;pointer-events:none;
  transition:background .08s,transform .08s}
.pad svg{width:34px;height:34px;fill:var(--gold);opacity:.9}
#padL{left:calc(env(safe-area-inset-left) + 18px)}
#padR{right:calc(env(safe-area-inset-right) + 18px)}
.pad.on{background:rgba(232,184,106,.30);transform:scale(.93)}
.desktop .pad{display:none}
#debug{position:fixed;z-index:4;top:calc(env(safe-area-inset-top) + 54px);right:calc(env(safe-area-inset-right) + 12px);
  font-size:10px;line-height:1.45;white-space:pre;background:rgba(0,0,0,.65);padding:6px 8px;color:#9fe0b0;display:none;pointer-events:none}
#title{position:fixed;inset:0;z-index:5;display:grid;place-items:center;text-align:center;padding:24px;
  background:radial-gradient(ellipse at center,rgba(6,8,10,.45),rgba(6,8,10,.93) 70%);transition:opacity .9s}
#title.gone{opacity:0;pointer-events:none}
#title small{display:block;font-size:11px;letter-spacing:.3em;color:var(--muted)}
#title h1{margin-top:8px;font-size:clamp(24px,5.2vw,42px);letter-spacing:.18em;color:var(--gold);font-weight:800}
#title p{margin-top:10px;font-size:12px;color:#bfb8a5;line-height:1.7}
#title .note{font-size:10px;color:#7e8883}
#title .tap{margin-top:18px;font-size:12px;color:var(--ink);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
#rotate{position:fixed;inset:0;z-index:6;display:none;place-items:center;text-align:center;background:#06080a;padding:30px;
  font-size:14px;line-height:1.7;color:var(--ink)}
#rotate b{color:var(--gold);letter-spacing:.12em}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:grid}}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="touch"></div>
<div id="hud">
  <div class="station"><b>ГАГАРИНСКАЯ</b><span id="zone">Центральная платформа</span></div>
  <button id="ver" type="button" aria-label="Версия сборки, нажмите для отладочной информации">v0.2</button>
</div>
<div id="hint">◀ ▶ — удерживайте, чтобы идти</div>
<div class="pad" id="padL"><svg viewBox="0 0 24 24"><path d="M15.5 4 7 12l8.5 8z"/></svg></div>
<div class="pad" id="padR"><svg viewBox="0 0 24 24"><path d="M8.5 4 17 12l-8.5 8z"/></svg></div>
<div id="debug"></div>
<div id="title">
  <div>
    <small>САМАРА · 2055</small>
    <h1>ПОСЛЕДНЯЯ ВЕТКА</h1>
    <p>Станция «Гагаринская» · прототип 0.2<br>
    <span class="note">Художественная модель станции — не схема реального метрополитена</span></p>
    <div class="tap" id="tapText">Коснитесь экрана, чтобы начать</div>
  </div>
</div>
<div id="rotate"><div><b>ПОВЕРНИТЕ ТЕЛЕФОН</b><br>Игра рассчитана на горизонтальную ориентацию</div></div>

<script>
/* ==========================================================================
   ПОСЛЕДНЯЯ ВЕТКА — прототип 0.2
   Один файл, Canvas 2D, без зависимостей.
   Разделы: CONFIG → UTIL → FONT → WORLD (пререндер слоёв) → PLAYER_SPRITE →
            INPUT → PLAYER → CAMERA → FX (частицы, свет) → RENDER → GAME (цикл)
   Все координаты мира — в «игровых пикселях» базовой высоты 270.
   ========================================================================== */
(() => {
'use strict';

/* =============================== CONFIG ================================== */
const CONFIG = {
  VERSION: '0.2',
  BASE_H: 270,              // высота сцены в игровых пикселях
  WORLD_W: 2000,            // ширина уровня
  FLOOR_Y: 219,             // линия ступней персонажа
  SEED: 2055,               // зерно генерации деталей (одинаковая картинка при каждом запуске)
  STEP: 1 / 60,             // фиксированный шаг логики
  PLAYER: {
    START_X: 1000,
    MIN_X: 150, MAX_X: 1856, // границы доступного участка платформы
    MAX_SPEED: 72,          // пикс/с
    ACCEL: 480, DECEL: 640, TURN: 1300,
    STRIDE: 3.3,            // сколько пикселей пути на один кадр ходьбы
  },
  CAMERA: { SMOOTH_TIME: 0.32, LOOK_AHEAD: 34, LOOK_RATE: 1.8 },
  PARALLAX: { BACK: 0.9, FORE: 1.22 },
  AMBIENT: [74, 80, 100],    // цвет «темноты» в карте освещения
  ZONES: [
    { name: 'Жилой сектор',          to: 740 },
    { name: 'Центральная платформа', to: 1300 },
    { name: 'Техническая зона',      to: Infinity },
  ],
};
const W = CONFIG.WORLD_W, H = CONFIG.BASE_H;
const COLUMNS = [];                       // x центров колонн
for (let x = 180; x <= 1820; x += 160) COLUMNS.push(x);
const toBack = mx => Math.round(mx * CONFIG.PARALLAX.BACK + 25);   // мировой x → x на дальнем слое
const toFore = mx => Math.round(mx * CONFIG.PARALLAX.FORE - 60);   // мировой x → x на ближнем слое

/* ================================ UTIL =================================== */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
function hash(x, y) {                     // детерминированный шум 0..1
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(CONFIG.SEED, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function noise1(t, seed = 0) {            // плавный одномерный шум 0..1
  const i = Math.floor(t), f = t - i, s = f * f * (3 - 2 * f);
  const a = hash(i, seed), b = hash(i + 1, seed);
  return a + (b - a) * s;
}
function makeRng(seed) {                  // mulberry32
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const rand = makeRng(CONFIG.SEED);
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const dither = (x, y) => (BAYER[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const rgb = (c, k = 1) => `rgb(${clamp(c[0] * k, 0, 255) | 0},${clamp(c[1] * k, 0, 255) | 0},${clamp(c[2] * k, 0, 255) | 0})`;
/** Прямоугольник целыми пикселями. */
function R(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
/** Линия по Брезенхэму толщиной `t` пикселей (по горизонтали). */
function L(g, x0, y0, x1, y1, c, t = 1) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  g.fillStyle = c;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;) {
    g.fillRect(x0 - (t >> 1), y0, t, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
/** Провисающий кабель (цепная линия упрощённо — парабола). */
function cable(g, x0, x1, y, sag, c) {
  for (let x = x0; x <= x1; x++) { const t = (x - x0) / (x1 - x0); R(g, x, y + Math.round(sag * 4 * t * (1 - t)), 1, 1, c); }
}
/** Заливка круга построчно (пиксельный круг). */
function disc(g, cx, cy, r, c) {
  g.fillStyle = c;
  for (let y = -r; y <= r; y++) { const w = Math.round(Math.sqrt(r * r - y * y)); g.fillRect(cx - w, cy + y, w * 2 + 1, 1); }
}
/** Попиксельная «покраска» участка канваса функцией fn(x, y, out[r,g,b,a]) → true, если пиксель рисуется. */
function paintRegion(g, x0, y0, w, h, fn) {
  const img = g.getImageData(x0, y0, w, h), d = img.data, out = [0, 0, 0, 255];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    out[3] = 255;
    if (fn(x0 + x, y0 + y, out)) { const i = (y * w + x) * 4; d[i] = out[0]; d[i + 1] = out[1]; d[i + 2] = out[2]; d[i + 3] = out[3]; }
  }
  g.putImageData(img, x0, y0);
}
function setC(o, r, g, b, n = 0) { o[0] = r + n; o[1] = g + n; o[2] = b + n; return true; }

/* ================================ FONT ===================================
   Пиксельный шрифт 5×7 для надписей внутри мира (кириллица, цифры). */
const FONT_SRC = {
  'А':'01110100011000111111100011000110001','Б':'11111100001000011110100011000111110','В':'11110100011000111110100011000111110',
  'Г':'11111100001000010000100001000010000','Д':'00110010100101001010010101111110001','Е':'11111100001000011110100001000011111',
  'Ж':'10101101010111000100011101010110101','З':'01110100010000100110000011000101110','И':'10001100011001110101110011000110001',
  'Й':'01010001001000110011101011100110001','К':'10001100101010011000101001001010001','Л':'00111010010100101001010010100111001',
  'М':'10001110111010110101100011000110001','Н':'10001100011000111111100011000110001','О':'01110100011000110001100011000101110',
  'П':'11111100011000110001100011000110001','Р':'11110100011000111110100001000010000','С':'01110100011000010000100001000101110',
  'Т':'11111001000010000100001000010000100','У':'10001100011000101111000011000101110','Ф':'00100011101010110101011100010000100',
  'Х':'10001100010101000100010101000110001','Ц':'10010100101001010010100101111100001','Ч':'10001100011000101111000010000100001',
  'Ш':'10101101011010110101101011010111111','Щ':'10101101011010110101101011111100001','Ы':'10001100011000111101100111001111101',
  'Ь':'10000100001000011110100011000111110','Э':'01110100010000100111000011000101110','Ю':'10010101011010111101101011010110010',
  'Я':'01111100011000101111001010100110001','0':'01110100011001110101110011000101110','1':'00100011000010000100001000010001110',
  '2':'01110100010000100010001000100011111','3':'11110000010000101110000010000111110','4':'00010001100101010010111110001000010',
  '5':'11111100001111000001000011000101110','6':'00110010001000011110100011000101110','7':'11111000010001000100010000100001000',
  '8':'01110100011000101110100011000101110','9':'01110100011000101111000010001001100',' ':'00000000000000000000000000000000000',
  '-':'00000000000000011111000000000000000',':':'00000001000010000000001000010000000','.':'00000000000000000000000000000000100',
  '!':'00100001000010000100001000000000100','№':'10010110101011010111100101001010011',
};
/** Рисует строку пиксельным шрифтом. Возвращает ширину. */
function drawText(g, str, x, y, color, shadow = null, scale = 1) {
  const pts = [];
  [...str.toUpperCase()].forEach((ch, i) => {
    const gl = FONT_SRC[ch]; if (!gl) return;
    for (let k = 0; k < 35; k++) if (gl[k] === '1') pts.push(x + (i * 6 + (k % 5)) * scale, y + ((k / 5) | 0) * scale);
  });
  if (shadow) { g.fillStyle = shadow; for (let i = 0; i < pts.length; i += 2) g.fillRect(pts[i], pts[i + 1] + scale, scale, scale); }
  g.fillStyle = color; for (let i = 0; i < pts.length; i += 2) g.fillRect(pts[i], pts[i + 1], scale, scale);
  return textWidth(str, scale);
}
const textWidth = (str, scale = 1) => ([...str].length * 6 - 1) * scale;
/** Табличка с надписью по центру cx. */
function plate(g, cx, y, str, bg, fg, rim) {
  const w = textWidth(str) + 10, x = Math.round(cx - w / 2);
  R(g, x - 1, y - 1, w + 2, 13, '#0d1012'); R(g, x, y, w, 11, bg); R(g, x, y, w, 1, rim);
  drawText(g, str, x + 5, y + 2, fg, 'rgba(0,0,0,.55)');
}

/* ================================ WORLD ==================================
   Мир собирается один раз при загрузке в три канваса-слоя:
   back  (параллакс 0.9) — дальняя стена зала;
   main  (1.0)          — верхний ярус с комнатами, перекрытие, колонны, платформа, пути;
   fore  (1.22)         — тёмные силуэты переднего плана.
   Параллельно заполняются списки источников света и «светящихся» элементов. */
const ROCK_H = 160;                     // толща грунта над станцией (видна на высоких экранах)
const WORLD = { rock: null, back: null, main: null, fore: null, lights: [], emissive: [], drips: [], fire: null, spark: null };

/** Регистрирует источник света. layer: 'main' | 'back'. */
function addLight(x, y, r, color, mode = 'steady', power = 1, layer = 'main') {
  const l = { x, y, r, c: color, mode, power, layer, seed: (rand() * 1000) | 0, i: 1, pool: false };
  WORLD.lights.push(l); return l;
}
/** Регистрирует светящийся элемент (лампочка, экран, индикатор), рисуемый поверх освещения. */
function addEmissive(x, y, w, h, color, light = null, layer = 'main', mode = null) {
  WORLD.emissive.push({ x, y, w, h, c: color, light, layer, mode, seed: (rand() * 1000) | 0 });
}

/* ---------- MAIN: базовые текстуры (камень, перекрытие, платформа, пути) ---------- */
function mainTexel(x, y, o) {
  const n = (hash(x, y) - 0.5) * 10;
  if (y < 108) {                                    // толща грунта/бетона вокруг верхнего яруса
    const s = Math.sin(y * 0.45 + Math.sin(x * 0.021) * 2.2) * 3;
    const crack = hash(x >> 3, y >> 1) > 0.985 ? -8 : 0;
    return setC(o, 25, 27, 31, n * 0.8 + s + crack);
  }
  if (y < 122) {                                    // межэтажное перекрытие
    if (y === 108) return setC(o, 112, 114, 106, n);
    if (y === 109) return setC(o, 86, 90, 87, n);
    if (y >= 119) return setC(o, 30, 33, 36, n * 0.6);
    let v = 68 + n * 1.2;
    if (x % 48 === 0 || x % 48 === 1) v -= 13;      // швы опалубки
    if (hash(x >> 1, 5) > 0.93 && y > 112) v -= 11; // потёки
    return setC(o, v - 4, v, v + 1);
  }
  if (y < 214) return false;                        // зал — прозрачен, там видна дальняя стена
  if (y < 222) {                                    // настил платформы: два ряда плит
    const row = y < 218 ? 0 : 1, tw = row ? 26 : 22, off = row ? 9 : 0;
    const seam = (x + off) % tw === 0 || y === 214 || y === 218;
    let v = (((x + off) / tw | 0) + row) % 2 ? 90 : 82;
    if (seam) v -= 28;
    if (y === 214) v -= 18;
    if (hash(x >> 2, y >> 1) > 0.94) v -= 14;       // грязь, сколы
    return setC(o, v + 6, v, v - 10, n * 0.9);
  }
  if (y === 222) return setC(o, 128, 120, 100, n);  // гранитная кромка
  if (y === 223) {                                  // стёртая жёлтая полоса
    const dash = (x % 14) < 9 && hash(x >> 1, 223) > 0.22;
    return dash ? setC(o, 184, 156, 84, n) : setC(o, 104, 98, 82, n);
  }
  if (y === 224) return setC(o, 90, 84, 72, n);
  if (y === 225) return setC(o, 44, 42, 40, n * 0.5);
  if (y < 231) {                                    // торец платформы
    const stain = hash(x >> 1, 7) > 0.9 ? -8 : 0;
    return setC(o, 30, 33, 36, n * 0.7 + stain);
  }
  // Путевая зона на переднем плане.
  if (y < 236) return setC(o, 19, 22, 25, n * 0.5);
  if (y === 236) return setC(o, 78, 72, 58, n);     // кожух контактного рельса
  if (y === 237) return setC(o, 54, 50, 42, n);
  if (y < 240) return setC(o, (x % 50) < 4 ? 70 : 34, (x % 50) < 4 ? 66 : 36, (x % 50) < 4 ? 58 : 38, n);
  if (y === 247) return setC(o, 156, 152, 140, n);  // дальний рельс
  if (y === 248) return setC(o, 110, 108, 100, n);
  if (y === 249 || y === 250) return setC(o, 62, 60, 56, n);
  if (y === 258) return setC(o, 176, 170, 152, n);  // ближний рельс
  if (y === 259) return setC(o, 132, 126, 112, n);
  if (y >= 260 && y <= 262) return setC(o, 76, 72, 64, n);
  if (y >= 251 && y <= 257 && (x % 22) < 12) {      // шпалы
    const edge = (x % 22) === 0 || (x % 22) === 11 || y === 251;
    return setC(o, edge ? 42 : 60, edge ? 36 : 50, edge ? 30 : 40, n);
  }
  // Балласт; к низу кадра темнее (дизеринг).
  const dark = dither(x, y) < (y - 240) / 40 ? 0.62 : 1;
  const stone = hash(x >> 1, y >> 1) > 0.7 ? 8 : 0;
  // Лужи с отражением.
  if (y >= 264 && y <= 267 && Math.sin(x * 0.013) > 0.72) return setC(o, 44, 56, 64, n * 0.6 + (y === 264 ? 10 : 0));
  return setC(o, (32 + stone) * dark, (34 + stone) * dark, (35 + stone) * dark, n * 0.7);
}

/* ---------- MAIN: верхний ярус (декоративные помещения в разрезе) ---------- */
const ROOMS = [
  { x: 140,  w: 290, label: 'ЖИЛОЙ БЛОК', type: 'bunks',    tint: [92, 76, 60],  light: [255, 196, 130] },
  { x: 440,  w: 290, label: 'СТОЛОВАЯ',   type: 'kitchen',  tint: [96, 80, 60],  light: [255, 190, 120] },
  { x: 740,  w: 120, label: 'ЗАВАЛ',      type: 'sealed',   tint: [22, 24, 26],  light: null },
  { x: 870,  w: 280, label: 'МАСТЕРСКАЯ', type: 'workshop', tint: [62, 84, 74],  light: [255, 206, 150] },
  { x: 1160, w: 150, label: 'МЕДПУНКТ',   type: 'medbay',   tint: [78, 92, 94],  light: [220, 236, 236] },
  { x: 1320, w: 290, label: 'ЭНЕРГОБЛОК', type: 'power',    tint: [60, 68, 82],  light: [200, 222, 240] },
  { x: 1620, w: 250, label: 'НАСОСНАЯ',   type: 'pumps',    tint: [56, 68, 74],  light: [190, 214, 228] },
];
function drawRoom(g, r) {

function backTexel(x, y, o) {
  if (y < 122 || y >= 214) return false;
  const mx = (x - 25) / CONFIG.PARALLAX.BACK, n = (hash(x, y) - 0.5) * 9;
  if (y < 128) return setC(o, 24, 27, 30, n * 0.6);
  if (y >= 196) {                                                       // гранитный цоколь
    if (y === 196) return setC(o, 78, 80, 78, n);
    if (y === 213) return setC(o, 18, 20, 22);
    return setC(o, 46, 48, 50, n + (hash(x >> 3, y >> 2) > 0.8 ? 6 : 0));
  }
  const grime = dither(x, y) < (y - 160) / 60 ? 0.8 : 1;
  const streak = hash(x >> 1, 11) > 0.92 && y < 128 + hash(x >> 1, 12) * 60 ? 0.84 : 1;
  const shadowTop = y < 132 ? 0.75 : 1;
  const k = grime * streak * shadowTop;
  if (mx < 740) {                                                       // жилой сектор: штукатурка, местами плитка
    const tile = y > 150 && ((x % 12 === 0) || (y % 8 === 0));
    return setC(o, (tile ? 70 : 82) * k, (tile ? 70 : 80) * k, (tile ? 64 : 70) * k, n);
  }

    const panel = (x / 30) | 0, seam = x % 30 === 0 || y === 162;
    const base = panel % 2 ? [84, 98, 96] : [78, 92, 89];
    const vein = Math.sin(x * 0.19 + y * 0.31 + panel * 1.7) + Math.sin(x * 0.05 - y * 0.12 + panel) * 0.6 > 1.42 ? 1.16 : 1;
    const kk = k * vein * (seam ? 0.74 : 1);
    return setC(o, base[0] * kk, base[1] * kk, base[2] * kk, n);
  }
  const seam = x % 48 === 0 || (y - 128) % 24 === 0;                    // техзона: бетон с опалубкой
  const rust = hash(x >> 2, 13) > 0.9 && y > 140 && y < 140 + hash(x >> 2, 14) * 50 ? [1.18, 0.92, 0.8] : [1, 1, 1];
  return setC(o, 66 * k * rust[0] * (seam ? 0.78 : 1), 68 * k * rust[1] * (seam ? 0.78 : 1), 66 * k * rust[2] * (seam ? 0.78 : 1), n);
}

function outline(g) {
  const img = g.getImageData(0, 0, SPRITE_W, SPRITE_H), d = img.data, a = i => d[i * 4 + 3] > 0;

  }
  add.forEach(i => { d[i * 4] = 11; d[i * 4 + 1] = 13; d[i * 4 + 2] = 16; d[i * 4 + 3] = 255; });

const SPRITES = { walk: [], idle: [], blink: null };
function buildSprites() {
  for (let i = 0; i < 8; i++) {                                          // 8 кадров ходьбы
    const p = (i / 8) * Math.PI * 2;
    const legF = { f: Math.round(Math.sin(p) * 5), lift: Math.cos(p) > 0.3 ? (Math.cos(p) > 0.8 ? 2 : 1) : 0 };
    const legB = { f: Math.round(Math.sin(p + Math.PI) * 5), lift: Math.cos(p + Math.PI) > 0.3 ? (Math.cos(p + Math.PI) > 0.8 ? 2 : 1) : 0 };
    SPRITES.walk.push(drawPersonFrame({ legFront: legF, legBack: legB, armFront: Math.round(-Math.sin(p) * 4), armBack: Math.round(Math.sin(p) * 4),
      bob: Math.abs(Math.sin(p)) > 0.6 ? 1 : 0, tail: 1, blink: false }));
  }
  const stand = { legFront: { f: 1, lift: 0 }, legBack: { f: -1, lift: 0 }, armFront: 0, armBack: 1, tail: 0 };
  SPRITES.idle.push(drawPersonFrame({ ...stand, bob: 0, blink: false }), drawPersonFrame({ ...stand, bob: 1, blink: false }));
  SPRITES.blink = drawPersonFrame({ ...stand, bob: 0, blink: true });
}

/* ================================ INPUT ===================================
   Направление = последнее нажатое из удерживаемых (клавиши и касания).
   Любая потеря фокуса/сворачивание сбрасывает всё — клавиши не залипают. */
const Input = {
  held: [],                                // стек источников: {id, dir}
  onFirstInput: null,
  dir() { return this.held.length ? this.held[this.held.length - 1].dir : 0; },
  press(id, dir) { this.release(id); this.held.push({ id, dir }); if (this.onFirstInput) { this.onFirstInput(); this.onFirstInput = null; } },
  release(id) { this.held = this.held.filter(h => h.id !== id); },
  clear() { this.held.length = 0; },
  init(touchEl, onReset) {
    const KEYS = { ArrowLeft: -1, KeyA: -1, ArrowRight: 1, KeyD: 1 };
    addEventListener('keydown', e => {
      if (e.code in KEYS) { e.preventDefault(); if (!e.repeat) this.press('k' + e.code, KEYS[e.code]); }
      else if (e.code === 'KeyR') onReset();
      else if (e.code === 'Backquote' || e.code === 'F3') { e.preventDefault(); Debug.toggle(); }
    });
    addEventListener('keyup', e => { if (e.code in KEYS) { e.preventDefault(); this.release('k' + e.code); } });
    const side = e => (e.clientX < innerWidth / 2 ? -1 : 1);
    touchEl.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { touchEl.setPointerCapture(e.pointerId); } catch (_) { /* capture не обязателен */ }
      this.press('p' + e.pointerId, side(e));
    });
    touchEl.addEventListener('pointermove', e => {                       // палец переполз на другую половину
      const h = this.held.find(x => x.id === 'p' + e.pointerId);
      if (h && h.dir !== side(e)) this.press(h.id, side(e));
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => touchEl.addEventListener(t, e => this.release('p' + e.pointerId)));
    addEventListener('blur', () => this.clear());
    addEventListener('pagehide', () => this.clear());
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.clear(); });
    ['gesturestart', 'gesturechange', 'contextmenu', 'dblclick'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  },
};

/* ================================ PLAYER ================================== */
const Player = {
  x: CONFIG.PLAYER.START_X, prevX: CONFIG.PLAYER.START_X, vx: 0, facing: 1,
  walkDist: 0, frame: 0, idleT: 0, blinkT: 3, onStep: null,
  reset() { this.x = this.prevX = CONFIG.PLAYER.START_X; this.vx = 0; this.walkDist = 0; },
  /** Разгон, торможение, разворот и границы. Анимация привязана к пройденному пути — ноги не скользят. */
  update(dt, dir) {
    const P = CONFIG.PLAYER;
    this.prevX = this.x;
    if (dir !== 0) {
      const a = Math.sign(this.vx) === -dir && this.vx !== 0 ? P.TURN : P.ACCEL;
      this.vx = clamp(this.vx + dir * a * dt, -P.MAX_SPEED, P.MAX_SPEED);
      this.facing = dir;
    } else {
      const s = Math.max(0, Math.abs(this.vx) - P.DECEL * dt); this.vx = Math.sign(this.vx) * s;
    }
    this.x += this.vx * dt;
    if (this.x < P.MIN_X) { this.x = P.MIN_X; this.vx = 0; }
    if (this.x > P.MAX_X) { this.x = P.MAX_X; this.vx = 0; }
    const moving = Math.abs(this.vx) > 4;
    if (moving) {
      this.walkDist += Math.abs(this.vx) * dt;
      const f = Math.floor(this.walkDist / P.STRIDE) % 8;
      if (f !== this.frame && (f === 2 || f === 6) && this.onStep) this.onStep(this.x, this.facing);
      this.frame = f; this.idleT = 0;
    } else {
      this.walkDist = 0; this.frame = 0; this.idleT += dt;
    }
    this.blinkT -= dt; if (this.blinkT < -0.12) this.blinkT = 2.5 + Math.random() * 3;
  },
  sprite() {
    if (Math.abs(this.vx) > 4) return SPRITES.walk[this.frame];
    if (this.blinkT < 0) return SPRITES.blink;
    return SPRITES.idle[Math.floor(this.idleT / 0.7) % 2];
  },
};

/* ================================ CAMERA ================================== */
const Camera = {
  x: 0, prevX: 0, vel: { v: 0 }, look: 0, viewW: 480,
  /** Критически демпфированное следование + упреждение в сторону взгляда. */
  update(dt, player) {
    this.prevX = this.x;
    const C = CONFIG.CAMERA, moving = Math.abs(player.vx) > 4;
    const lookTarget = player.facing * (moving ? C.LOOK_AHEAD : C.LOOK_AHEAD * 0.4);
    this.look += (lookTarget - this.look) * (1 - Math.exp(-dt * C.LOOK_RATE));
    const target = this.clampX(player.x + this.look - this.viewW / 2);
    const omega = 2 / C.SMOOTH_TIME, x = omega * dt, e = 1 / (1 + x + 0.48 * x * x + 0.235 * x * x * x);
    const change = this.x - target, temp = (this.vel.v + omega * change) * dt;
    this.vel.v = (this.vel.v - omega * temp) * e;
    this.x = this.clampX(target + (change + temp) * e);
  },
  clampX(x) { return clamp(x, 0, Math.max(0, W - this.viewW)); },
  snap(player) { this.look = player.facing * CONFIG.CAMERA.LOOK_AHEAD * 0.4; this.x = this.prevX = this.clampX(player.x + this.look - this.viewW / 2); this.vel.v = 0; },
};

/* ================================== FX ==================================== */
const FX = {
  dust: [], puffs: [], embers: [], sparks: [], splashes: [],
  init() {
    for (let i = 0; i < 90; i++) this.dust.push({ x: rand() * 600, y: 128 + rand() * 84, vx: (rand() - 0.5) * 3, vy: (rand() - 0.5) * 1.5, ph: rand() * 6.28, a: 0.25 + rand() * 0.45 });
  },
  step(x, facing) {
    for (let k = 0; k < 2; k++) this.puffs.push({ x: x - facing * 2 + (rand() - 0.5) * 4, y: CONFIG.FLOOR_Y, vx: -facing * (4 + rand() * 6), vy: -2 - rand() * 3, life: 0.5 });
  },
  update(dt, t, camX, viewW) {
    for (const d of this.dust) {                                        // пыль висит в зале и «заворачивается» в кадр
      d.x += d.vx * dt + Math.sin(t * 0.4 + d.ph) * 0.06; d.y += d.vy * dt + Math.cos(t * 0.3 + d.ph) * 0.04;
      const span = viewW + 40;
      if (d.x < camX - 20) d.x += span; else if (d.x > camX + viewW + 20) d.x -= span;
      if (d.y < 128) d.y = 211; else if (d.y > 212) d.y = 128;
    }
    this.puffs = this.puffs.filter(p => (p.life -= dt) > 0 && ((p.x += p.vx * dt), (p.y += p.vy * dt), (p.vx *= 0.92), true));
    // Огонь в бочке выбрасывает искры.
    if (rand() < dt * 7) this.embers.push({ x: WORLD.fire.x + (rand() - 0.5) * 8, y: WORLD.fire.y - 4, vx: (rand() - 0.5) * 6, vy: -14 - rand() * 12, life: 1 + rand() });
    this.embers = this.embers.filter(e => (e.life -= dt) > 0 && ((e.x += e.vx * dt + Math.sin(t * 5 + e.y) * 0.08), (e.y += e.vy * dt), true));
    // Капли с потолка.
    for (const d of WORLD.drips) {
      if (!d.active) { d.wait -= dt; if (d.wait <= 0) { d.active = true; d.y = 132; d.v = 0; } continue; }
      d.v += 260 * dt; d.y += d.v * dt;
      if (d.y >= 214) { d.active = false; d.wait = 1.4 + rand() * 2.2;
        for (let k = 0; k < 3; k++) this.splashes.push({ x: d.x, y: 213, vx: (rand() - 0.5) * 24, vy: -18 - rand() * 14, life: 0.35 }); }
    }
    this.splashes = this.splashes.filter(s => (s.life -= dt) > 0 && ((s.vy += 200 * dt), (s.x += s.vx * dt), (s.y += s.vy * dt), true));
    // Оборванный кабель искрит.
    const sp = WORLD.spark; sp.timer -= dt;
    if (sp.timer <= 0) {
      sp.timer = 2 + rand() * 4; sp.flash.i = 1;
      for (let k = 0; k < 14; k++) this.sparks.push({ x: sp.x, y: sp.y, vx: (rand() - 0.5) * 70, vy: -10 - rand() * 40, life: 0.3 + rand() * 0.5 });
    }
    sp.flash.i = Math.max(0, sp.flash.i - dt * 7);
    this.sparks = this.sparks.filter(s => (s.life -= dt) > 0 && ((s.vy += 160 * dt), (s.x += s.vx * dt), (s.y = Math.min(213, s.y + s.vy * dt)), true));
  },
};

/** Яркость источника в момент t по его режиму. */
function lightIntensity(l, t) {
  switch (l.mode) {
    case 'steady':  return 1 - noise1(t * 3, l.seed) * 0.05;
    case 'flicker': { const slow = noise1(t * 0.5, l.seed) < 0.3 ? 0.08 : 1; return (noise1(t * 9, l.seed + 1) > 0.3 ? 1 : 0.18) * slow; }
    case 'dead':    return 0;
    case 'fire':    return 0.78 + noise1(t * 9, l.seed) * 0.3 + Math.sin(t * 23 + l.seed) * 0.04;
    case 'pulse':   return 0.2 + 0.8 * Math.pow(Math.max(0, Math.sin(t * 3.1)), 2);
    case 'screen':  return 0.8 + (noise1(t * 14, l.seed) > 0.85 ? -0.4 : 0) + Math.sin(t * 40) * 0.03;
    case 'garland': return 0.75 + Math.sin(t * 1.2 + l.seed) * 0.25;
    case 'spark':   return l.i;
    default:        return 1;
  }
}

/* ================================ RENDER ==================================
   Сцена рисуется в маленький буфер (viewW+1 × viewH игровых пикселей), потом
   растягивается на экран с ЦЕЛЫМ коэффициентом и сдвигом на дробную часть камеры —
   пиксели одинаковые и чёткие, а прокрутка плавная. */
const Render = {
  canvas: null, ctx: null, buf: null, g: null, light: null, gl: null, vignette: null,
  scale: 1, viewW: 480, viewH: 270, yoff: 0, devW: 0, devH: 0, dpr: 1, drawnLights: 0,
  init(canvas) { this.canvas = canvas; this.ctx = canvas.getContext('2d', { alpha: false }); this.resize(); },
  /** Подбор целочисленного масштаба под экран; вызывается при повороте/изменении размера. */
  resize() {
    const vv = window.visualViewport, cssW = Math.round(vv ? vv.width : innerWidth), cssH = Math.round(vv ? vv.height : innerHeight);
    this.dpr = Math.min(window.devicePixelRatio || 1, 3);
    this.devW = Math.round(cssW * this.dpr); this.devH = Math.round(cssH * this.dpr);
    this.canvas.width = this.devW; this.canvas.height = this.devH;
    this.canvas.style.width = cssW + 'px'; this.canvas.style.height = cssH + 'px';
    this.scale = Math.max(1, Math.floor(this.devH / H));
    this.viewH = Math.ceil(this.devH / this.scale);
    this.viewW = Math.min(W, Math.ceil(this.devW / this.scale));
    this.yoff = this.viewH - H;                                         // лишние строки — сверху (толща грунта)
    this.buf = makeCanvas(this.viewW + 1, this.viewH); this.g = this.buf.getContext('2d');
    this.light = makeCanvas(this.viewW + 1, this.viewH); this.gl = this.light.getContext('2d');
    this.vignette = this.makeVignette();
    Camera.viewW = this.viewW;
    this.ctx.imageSmoothingEnabled = false;
  },
  makeVignette() {
    const c = makeCanvas(this.viewW + 1, this.viewH), g = c.getContext('2d'), w = c.width, h = c.height;
    const grd = g.createRadialGradient(w / 2, h * 0.55, h * 0.35, w / 2, h * 0.55, Math.max(w, h) * 0.72);
    grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(0,0,0,0.55)');
    g.fillStyle = grd; g.fillRect(0, 0, w, h); return c;
  },
  /** Перевод мировой координаты в координату буфера для слоя с параллаксом p. */
  sx(x, p, camX, frac) { return Math.round(x - camX * p + frac); },
  frame(alpha, t) {
    const g = this.g, yo = this.yoff, camX = Camera.prevX + (Camera.x - Camera.prevX) * alpha;
    const camI = Math.floor(camX), frac = camX - camI, vw = this.viewW + 1, vh = this.viewH;
    const PB = CONFIG.PARALLAX.BACK, PF = CONFIG.PARALLAX.FORE;
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
    g.fillStyle = '#16181b'; g.fillRect(0, 0, vw, vh);
    // 1. Слои мира.
    if (yo > 0) g.drawImage(WORLD.rock, -camI, yo - ROCK_H);
    g.drawImage(WORLD.back, this.sx(0, PB, camX, frac), yo);
    g.drawImage(WORLD.main, -camI, yo);
    // 2. Динамика под освещением (освещается картой света).
    g.fillStyle = 'rgb(222,212,190)';
    for (const d of FX.dust) { g.globalAlpha = d.a; g.fillRect(Math.round(d.x - camI), Math.round(d.y + yo), 1, 1); }
    g.globalAlpha = 1;
    g.fillStyle = 'rgba(170,200,215,.85)';
    for (const d of WORLD.drips) if (d.active) g.fillRect(d.x - camI, Math.round(d.y) + yo, 1, 2);
    for (const s of FX.splashes) g.fillRect(Math.round(s.x - camI), Math.round(s.y) + yo, 1, 1);
    g.fillStyle = 'rgba(150,140,120,.5)';
    for (const p of FX.puffs) { g.globalAlpha = p.life * 1.4; g.fillRect(Math.round(p.x - camI), Math.round(p.y) + yo, 2, 1); }
    g.globalAlpha = 1;
    // 3. Персонаж и его тень.
    const px = Math.round(Player.prevX + (Player.x - Player.prevX) * alpha) - camI, fy = CONFIG.FLOOR_Y + yo;
    g.fillStyle = 'rgba(0,0,0,.42)'; g.fillRect(px - 8, fy, 17, 1); g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(px - 6, fy + 1, 13, 1);
    const spr = Player.sprite();
    if (Player.facing > 0) g.drawImage(spr, px - 13, fy - 40);
    else { g.save(); g.translate(px - 12 + SPRITE_W, fy - 40); g.scale(-1, 1); g.drawImage(spr, 0, 0); g.restore(); }
    // 4. Карта освещения: тёмный фон + сложение источников, затем умножение на сцену.
    this.drawLightmap(camX, frac, t, px);
    g.globalCompositeOperation = 'multiply'; g.drawImage(this.light, 0, 0);
    g.globalCompositeOperation = 'source-over';
    // 5. Светящиеся элементы поверх темноты.
    this.drawEmissive(camX, frac, t);
    // 6. Передний план и виньетка.
    g.drawImage(WORLD.fore, this.sx(0, PF, camX, frac), yo);
    g.drawImage(this.vignette, 0, 0);
    // 7. На экран: целый масштаб, сдвиг на дробную часть камеры, нижний край сцены = нижний край экрана.
    const s = this.scale;
    this.ctx.imageSmoothingEnabled = false;
    this.ctx.drawImage(this.buf, Math.round(-frac * s), this.devH - vh * s, vw * s, vh * s);
  },
  drawLightmap(camX, frac, t, playerSX) {
    const gl = this.gl, yo = this.yoff, vw = this.viewW + 1, A = CONFIG.AMBIENT;
    gl.globalCompositeOperation = 'source-over'; gl.globalAlpha = 1;
    gl.fillStyle = `rgb(${A[0]},${A[1]},${A[2]})`; gl.fillRect(0, 0, vw, this.viewH);
    gl.globalCompositeOperation = 'lighter';
    let n = 0;
    const blob = (x, y, r, c, a, sy = 1) => {
      if (a <= 0.01 || x + r < 0 || x - r > vw) return;
      gl.save(); gl.translate(x, y); if (sy !== 1) gl.scale(1, sy);
      const grd = gl.createRadialGradient(0, 0, 0, 0, 0, r);
      grd.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},1)`); grd.addColorStop(0.4, `rgba(${c[0]},${c[1]},${c[2]},.5)`);
      grd.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);
      gl.globalAlpha = Math.min(1, a); gl.fillStyle = grd; gl.fillRect(-r, -r, r * 2, r * 2); gl.restore(); n++;
    };
    for (const l of WORLD.lights) {
      const p = l.layer === 'back' ? CONFIG.PARALLAX.BACK : 1;
      const x = this.sx(l.x, p, camX, frac), y = l.y + yo;
      l.i = lightIntensity(l, t);
      blob(x, y, l.r, l.c, l.i * l.power * 0.85);
      if (l.pool) blob(x, 215 + yo, l.r * 0.75, l.c, l.i * 0.55, 0.22);  // пятно света на полу
    }
    blob(playerSX, 196 + yo, 50, [160, 150, 128], 0.5);                 // мягкая подсветка героя для читаемости
    this.drawnLights = n;
  },
  drawEmissive(camX, frac, t) {
    const g = this.g, yo = this.yoff;
    for (const e of WORLD.emissive) {
      const p = e.layer === 'back' ? CONFIG.PARALLAX.BACK : 1, x = this.sx(e.x, p, camX, frac);
      if (x + e.w < 0 || x > this.viewW + 1) continue;
      let k = e.light ? e.light.i : 1;
      if (e.mode === 'blink') k = noise1(t * 1.5, e.seed) > 0.35 ? 1 : 0.25;
      if (e.mode === 'garland') k = 0.55 + 0.45 * Math.sin(t * 2 + e.seed);
      if (e.mode === 'water') k = 0.7;
      if (k < 0.12) continue;
      g.fillStyle = rgb(e.c, 0.35 + 0.65 * k);
      g.fillRect(x, e.y + yo, e.w, e.h);
      if (e.mode === 'screen') { g.fillStyle = 'rgba(10,30,26,.5)'; for (let y = e.y + yo + 1; y < e.y + yo + e.h; y += 2) g.fillRect(x, y, e.w, 1); }
    }
    this.drawFire(this.sx(WORLD.fire.x, 1, camX, frac), WORLD.fire.y + yo, t);
    const camI = Math.floor(camX);
    for (const e of FX.embers) { g.fillStyle = e.life > 0.6 ? '#ffd27a' : '#e0703a'; g.fillRect(Math.round(e.x - camI), Math.round(e.y) + yo, 1, 1); }
    g.fillStyle = '#d8ecff';
    for (const s of FX.sparks) g.fillRect(Math.round(s.x - camI), Math.round(s.y) + yo, 1, 1);
    // Мягкие ореолы ламп и огня.
    g.globalCompositeOperation = 'lighter';
    for (const l of WORLD.lights) {
      if (l.i < 0.2 || l.mode === 'garland') continue;
      const p = l.layer === 'back' ? CONFIG.PARALLAX.BACK : 1, x = this.sx(l.x, p, camX, frac), y = l.y - 3 + yo, r = l.mode === 'fire' ? 16 : 10;
      if (x + r < 0 || x - r > this.viewW + 1) continue;
      const grd = g.createRadialGradient(x, y, 0, x, y, r);
      grd.addColorStop(0, `rgba(${l.c[0]},${l.c[1]},${l.c[2]},${0.32 * l.i * l.power})`); grd.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grd; g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    g.globalCompositeOperation = 'source-over';
  },
  drawFire(x, y, t) {
    const g = this.g;
    for (let i = -5; i <= 5; i++) {
      const h = Math.round((3 + noise1(t * 9 + i * 1.7, 77) * 9) * (1 - Math.abs(i) / 6.5));
      for (let k = 0; k < h; k++) {
        const r = k / Math.max(1, h);
        g.fillStyle = r < 0.35 ? '#ffe6a0' : r < 0.7 ? '#ff9a3c' : '#c8461e';
        g.fillRect(x + i, y - k, 1, 1);
      }
    }
  },
};

/* ================================ DEBUG =================================== */
const Debug = {
  el: null, on: /[?&]debug/.test(location.search), fps: 60,
  init() { this.el = document.getElementById('debug'); this.el.style.display = this.on ? 'block' : 'none'; },
  toggle() { this.on = !this.on; this.el.style.display = this.on ? 'block' : 'none'; },
  update(dt) {
    if (dt > 0) this.fps += (1 / dt - this.fps) * 0.05;
    if (!this.on) return;
    this.el.textContent =
      `FPS   ${this.fps.toFixed(0)}\nX     ${Player.x.toFixed(1)}  v ${Player.vx.toFixed(1)}\nCAM   ${Camera.x.toFixed(2)}\n` +
      `VIEW  ${Render.viewW}×${Render.viewH} ×${Render.scale}\nDPR   ${Render.dpr}  LIGHTS ${Render.drawnLights}\nINPUT ${Input.dir()}`;
  },
};

/* ================================= GAME =================================== */
const Game = {
  t: 0, acc: 0, last: 0, running: true, zone: '',
  els: {},
  start() {
    this.els = { zone: document.getElementById('zone'), hint: document.getElementById('hint'), title: document.getElementById('title'),
      padL: document.getElementById('padL'), padR: document.getElementById('padR') };
    const coarse = matchMedia('(pointer:coarse)').matches;
    if (!coarse) { document.body.classList.add('desktop'); this.els.hint.textContent = 'A / D или ← / → — идти · R — в центр';
      document.getElementById('tapText').textContent = 'Нажмите клавишу или кликните, чтобы начать'; }
    buildWorld(); buildSprites(); FX.init();
    Render.init(document.getElementById('screen'));
    Debug.init();
    Player.onStep = (x, f) => FX.step(x, f);
    Input.init(document.getElementById('touch'), () => { Player.reset(); Camera.snap(Player); });
    Input.onFirstInput = () => this.hideTitle();
    this.els.title.addEventListener('pointerdown', e => { e.preventDefault(); this.hideTitle(); });
    addEventListener('keydown', () => this.hideTitle(), { once: true });
    document.getElementById('ver').addEventListener('click', () => Debug.toggle());
    const onResize = () => { Render.resize(); Camera.snap(Player); };
    addEventListener('resize', onResize);
    if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.last = performance.now(); });
    Camera.snap(Player);
    this.updateZone();
    this.last = performance.now();
    requestAnimationFrame(now => this.frame(now));
  },
  hideTitle() {
    if (this.els.title.classList.contains('gone')) return;
    this.els.title.classList.add('gone');
    setTimeout(() => this.els.hint.classList.add('gone'), 6000);
  },
  /** Главный цикл: логика фиксированным шагом, отрисовка с интерполяцией. */
  frame(now) {
    let dt = (now - this.last) / 1000; this.last = now;
    if (dt > 0.25) dt = 0.25;                                           // после сворачивания не «телепортируемся»
    this.acc += dt;
    const STEP = CONFIG.STEP;
    while (this.acc >= STEP) { this.update(STEP); this.acc -= STEP; }
    Render.frame(this.acc / STEP, this.t);
    Debug.update(dt);
    requestAnimationFrame(n => this.frame(n));
  },
  update(dt) {
    this.t += dt;
    const dir = Input.dir();
    Player.update(dt, dir);
    Camera.update(dt, Player);
    FX.update(dt, this.t, Camera.x, Render.viewW);
    this.els.padL.classList.toggle('on', dir < 0);
    this.els.padR.classList.toggle('on', dir > 0);
    this.updateZone();
  },
  updateZone() {
    const z = CONFIG.ZONES.find(z => Player.x < z.to).name;
    if (z !== this.zone) { this.zone = z; this.els.zone.textContent = z; }
  },
};

Game.start();
})();
</script>
